[tools]
# Core language and runtime tools
go = "1.25.1"

# Development and build tools
golangci-lint = "latest"
gh = "latest"                                           # GitHub CLI for releases
"go:github.com/isaacphi/mcp-language-server" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"go:mvdan.cc/gofumpt" = "latest"                        # Stricter Go formatter

[settings]
experimental = true

[env]
# Version-related environment variables
VERSION = "{{exec(command='cat VERSION.txt')}}"
GIT_COMMIT = "{{exec(command='git rev-parse --short HEAD 2>/dev/null || echo unknown')}}"
BUILD_TIME = "{{exec(command='date -u \"+%a %b %d %I:%M:%S %p UTC %Y\"')}}"

# Version package path for ldflags
VERSION_PKG = "github.com/jingkaihe/waitrose/version"

[tasks.build]
description = "Build the CLI application"
run = [
  "mkdir -p bin",
  "echo 'Building waitrose CLI binary...'",
  "CGO_ENABLED=0 go build -ldflags=\"-X '$VERSION_PKG.Version=$VERSION' -X '$VERSION_PKG.GitCommit=$GIT_COMMIT' -X '$VERSION_PKG.BuildTime=$BUILD_TIME'\" -o ./bin/waitrose ./cmd/waitrose/",
]

[tasks.test]
description = "Run Go tests"
run = ["go test ./..."]

[tasks.format]
description = "Format Go code with gofumpt"
run = ["gofumpt -w ."]

[tasks.lint]
description = "Run all linters (go vet, golangci-lint, staticcheck)"
run = ["go vet ./...", "echo 'Running golangci-lint...'", "golangci-lint run", "echo 'Running staticcheck...'", "staticcheck -checks=all ./..."]

[tasks.cross-build]
description = "Cross-compile for multiple platforms"
run = [
  "mkdir -p bin",
  "echo 'Cross-compiling for multiple platforms...'",
  "CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags=\"-X '$VERSION_PKG.Version=$VERSION' -X '$VERSION_PKG.GitCommit=$GIT_COMMIT' -X '$VERSION_PKG.BuildTime=$BUILD_TIME'\" -o ./bin/waitrose-linux-amd64 ./cmd/waitrose/",
  "CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags=\"-X '$VERSION_PKG.Version=$VERSION' -X '$VERSION_PKG.GitCommit=$GIT_COMMIT' -X '$VERSION_PKG.BuildTime=$BUILD_TIME'\" -o ./bin/waitrose-linux-arm64 ./cmd/waitrose/",
  "CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags=\"-X '$VERSION_PKG.Version=$VERSION' -X '$VERSION_PKG.GitCommit=$GIT_COMMIT' -X '$VERSION_PKG.BuildTime=$BUILD_TIME'\" -o ./bin/waitrose-darwin-amd64 ./cmd/waitrose/",
  "CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags=\"-X '$VERSION_PKG.Version=$VERSION' -X '$VERSION_PKG.GitCommit=$GIT_COMMIT' -X '$VERSION_PKG.BuildTime=$BUILD_TIME'\" -o ./bin/waitrose-darwin-arm64 ./cmd/waitrose/",
  "CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags=\"-X '$VERSION_PKG.Version=$VERSION' -X '$VERSION_PKG.GitCommit=$GIT_COMMIT' -X '$VERSION_PKG.BuildTime=$BUILD_TIME'\" -o ./bin/waitrose-windows-amd64.exe ./cmd/waitrose/",
]

[tasks.install]
description = "Install Go module dependencies"
run = [
  "echo 'Installing Go modules...'",
  "go mod download",
  "go mod tidy",
  "echo 'All dependencies installed successfully!'",
]

[tasks.release]
description = "Create GitHub release with cross-compiled binaries"
depends = ["cross-build"]
run = [
  "gh release create v$VERSION",
  "gh release upload v$VERSION ./bin/waitrose-linux-amd64",
  "gh release upload v$VERSION ./bin/waitrose-linux-arm64",
  "gh release upload v$VERSION ./bin/waitrose-darwin-amd64",
  "gh release upload v$VERSION ./bin/waitrose-darwin-arm64",
  "gh release upload v$VERSION ./bin/waitrose-windows-amd64.exe",
]

[tasks.push-tag]
description = "Push version tag to trigger automated GitHub Actions release"
run = [
  "echo 'Creating and pushing tag v$VERSION...'",
  "if git rev-parse \"v$VERSION\" >/dev/null 2>&1; then echo 'Tag v$VERSION already exists locally. Pushing to origin...'; else echo 'Creating new tag v$VERSION...'; git tag v$VERSION; fi",
  "git push origin v$VERSION",
  "echo 'Tag v$VERSION pushed successfully!'",
  "echo 'GitHub Actions will automatically create a release with binaries.'",
]

# Convenience aliases for common tasks
[tasks.run]
description = "Build and run the CLI"
depends = ["build"]
run = ["./bin/waitrose"]
