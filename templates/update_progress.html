<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updating… — Meal Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4361ee; --bg: #f8f9fa; --text: #212529; --muted: #6c757d; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
               display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card-box { background: #fff; border: 1px solid #e9ecef; border-radius: 14px;
                    padding: 32px 40px; width: 440px; box-shadow: 0 4px 18px rgba(0,0,0,.06); text-align: center; }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
        .progress { height: 12px; }
        .pct { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
        .msg { font-size: 14px; margin-top: 14px; min-height: 20px; }
        .spinner { width: 42px; height: 42px; margin: 0 auto 14px; border: 4px solid #e9ecef;
                   border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { background: #fdecec; border: 1px solid #f5c2c7; color: #842029;
                 border-radius: 10px; padding: 14px 16px; font-size: 13px; text-align: left;
                 white-space: pre-wrap; margin-bottom: 16px; }
        a { color: var(--primary); }
    </style>
</head>
<body>
    <div class="card-box">
        <div class="spinner" id="spinner"></div>
        <h1 id="title">Updating your app…</h1>
        <div class="sub" id="sub">Version {{ job.tag }} is being installed. This only takes a moment.</div>
        <div class="progress" id="barwrap">
            <div class="progress-bar" id="bar" style="width:0%;background:#4361ee;"></div>
        </div>
        <div class="pct" id="pct"></div>
        <div class="msg" id="msg">{{ job.message }}</div>
        <div class="error" id="errorbox" style="display:none;"></div>
        <div id="actions" style="display:none;">
            <a class="btn btn-primary btn-sm" href="/">Open the app</a>
            <a class="btn btn-outline-secondary btn-sm" href="/updates/download" target="_blank">Download manually instead</a>
        </div>
        <div class="mt-4" style="font-size:12px;color:var(--muted);">
            Your meals, lists and settings are not affected.
        </div>
    </div>

    <script>
    (function () {
        var bar = document.getElementById('bar');
        var pct = document.getElementById('pct');
        var msg = document.getElementById('msg');
        var title = document.getElementById('title');
        var sub = document.getElementById('sub');
        var spinner = document.getElementById('spinner');
        var barwrap = document.getElementById('barwrap');
        var errorbox = document.getElementById('errorbox');
        var actions = document.getElementById('actions');

        function backToApp() {
            // The app is coming back up (or already is): poll the root and
            // redirect as soon as it answers.
            spinner.style.display = 'block';
            title.textContent = 'Almost done…';
            sub.textContent = 'Starting the new version. The app will reopen shortly.';
            barwrap.style.display = 'none';
            msg.textContent = '';
            (function wait() {
                fetch('/', {method: 'HEAD'})
                    .then(function (r) { if (r.ok) { window.location.replace('/'); } else { setTimeout(wait, 1500); } })
                    .catch(function () { setTimeout(wait, 1500); });
            })();
        }

        function tick() {
            fetch('/updates/progress.json')
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    var job = d.job;
                    if (job.state === 'downloading') {
                        spinner.style.display = 'block';
                        barwrap.style.display = '';
                        title.textContent = 'Updating your app…';
                        bar.style.width = (job.progress || 0) + '%';
                        pct.textContent = Math.round(job.progress || 0) + '%';
                        msg.textContent = job.message || '';
                    } else if (job.state === 'installing' || job.state === 'restarting') {
                        spinner.style.display = 'block';
                        bar.style.width = '100%';
                        pct.textContent = '100%';
                        title.textContent = 'Installing the new version…';
                        msg.textContent = job.message || '';
                    } else if (job.state === 'error') {
                        spinner.style.display = 'none';
                        barwrap.style.display = 'none';
                        title.textContent = 'The update did not finish';
                        sub.textContent = 'No harm done — you are still running version ' + d.status.current_version + '.';
                        errorbox.style.display = '';
                        errorbox.textContent = (job.error || 'Something went wrong.') +
                            (job.manual_url ? '\n\nYou can install manually instead: ' + job.manual_url : '');
                        actions.style.display = '';
                        return;
                    } else {
                        // 'idle' / 'done': the job is no longer running. After
                        // a restart the *new* process always reports 'idle'
                        // (it has no memory of our job), so this is also how
                        // we detect that the update completed and the app
                        // came back up — hand over to the app.
                        backToApp();
                        return;
                    }
                    setTimeout(tick, 1500);
                })
                .catch(function () {
                    // Network gone: most likely the app is restarting.
                    backToApp();
                });
        }
        tick();
    })();
    </script>
</body>
</html>
