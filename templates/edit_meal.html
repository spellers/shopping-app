{% extends "base.html" %}
{% block title %}Edit {{ meal['name'] }} - Meal Planner{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Edit Meal</h2>
    <a href="/meal_tracker/{{ meal['id'] }}" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>
<div class="card" style="max-width:500px;">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label" style="font-weight:500; font-size:13px;">Meal Name</label>
                <input type="text" name="name" class="form-control" value="{{ meal['name'] }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" style="font-weight:500; font-size:13px;">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ meal['description'] or '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/meal_tracker" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
