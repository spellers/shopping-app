{% extends "base.html" %}
{% block title %}Add Ingredient - Meal Planner{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Add Ingredient</h2>
    <a href="/meal_tracker/{{ meal_id }}" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>
<div class="card" style="max-width:500px;">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label" style="font-weight:500; font-size:13px;">Ingredient Name</label>
                <input type="text" name="name" class="form-control" required placeholder="e.g. Garlic">
            </div>
            <div class="row mb-3">
                <div class="col">
                    <label class="form-label" style="font-weight:500; font-size:13px;">Quantity</label>
                    <input type="text" name="quantity" class="form-control" placeholder="e.g. 3">
                </div>
                <div class="col">
                    <label class="form-label" style="font-weight:500; font-size:13px;">Unit</label>
                    <input type="text" name="unit" class="form-control" placeholder="e.g. cloves">
                </div>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="shareable" name="shareable" value="1" checked>
                <label class="form-check-label" for="shareable" style="font-size:13px;">
                    Shared across meals
                    <span class="text-muted">(one unit is enough for all meals; untick for e.g. chicken &amp; mince — you'll need one per meal)</span>
                </label>
            </div>
            <button type="submit" class="btn btn-success">Add Ingredient</button>
            <a href="/meal_tracker/{{ meal_id }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
