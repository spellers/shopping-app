{% extends "base.html" %}
{% block title %}Add Options - {{ vote_name }}{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Add Options for "{{ vote_name }}"</h2>
    <a href="/vote/{{ vote_id }}" class="btn btn-outline-secondary">← Back</a>
</div>
<form method="POST">
    <div class="card mb-4">
        <div class="card-body">
            <p class="text-muted mb-3">Select meals to include as vote options:</p>
            {% for meal in meals %}
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" name="meal_ids" value="{{ meal.id }}" id="meal_{{ meal.id }}">
                <label class="form-check-label" for="meal_{{ meal.id }}">
                    {{ meal.name }}
                </label>
            </div>
            {% endfor %}
        </div>
    </div>
    <button type="submit" class="btn btn-success">Add Options</button>
    <a href="/vote/{{ vote_id }}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
